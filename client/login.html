in<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Travel</title>

    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .login {
        min-height: calc(100vh - var(--header-height));
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("assets/img/home1.jpg");
        background-size: cover;
        background-position: center;
        padding: 2rem;
        margin-top: var(--header-height);
      }

      .login__container {
        background-color: rgba(255, 255, 255, 0.95);
        padding: 2rem 2.5rem;
        border-radius: 1rem;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      body.dark-theme .login__container {
        background-color: rgba(34, 34, 34, 0.95);
        color: #fff;
      }

      .login__title {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      .login__input {
        width: 100%;
        padding: 0.75rem;
        margin: 0.5rem 0;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.3s;
      }

      .login__input:focus {
        outline: none;
        border-color: hsl(190, 64%, 22%);
        box-shadow: 0 0 0 2px rgba(14, 55, 63, 0.1);
      }

      body.dark-theme .login__input {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
      }

      body.dark-theme .login__input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      .login__button {
        margin-top: 1rem;
        width: 100%;
      }

      .login__links {
        margin-top: 1rem;
        font-size: 0.9rem;
      }

      .login__links a {
        color: hsl(190, 64%, 22%);
        text-decoration: none;
        font-weight: 500;
      }

      .login__links a:hover {
        text-decoration: underline;
      }

      body.dark-theme .login__links a {
        color: #60a5fa;
      }

      .login__error {
        background-color: #fee2e2;
        color: #991b1b;
        padding: 0.75rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        display: none;
      }

      body.dark-theme .login__error {
        background-color: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }

      .login__error.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Header/Navbar -->
    <header class="header" id="header">
      <nav class="nav container">
        <a href="index.html" class="nav__logo">Travel</a>

        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="index.html" class="nav__link">Home</a>
            </li>
            <li class="nav__item">
              <a href="about.html" class="nav__link">About</a>
            </li>
            <li class="nav__item">
              <a href="discover.html" class="nav__link">Discover</a>
            </li>
            <li class="nav__item">
              <a href="places.html" class="nav__link">Places</a>
            </li>
            <li class="nav__item">
              <a href="login.html" class="nav__link active-link">Login</a>
            </li>
          </ul>

          <div class="nav__dark">
            <span class="change-theme-name">Dark mode</span>
            <i class="ri-moon-line change-theme" id="theme-button"></i>
          </div>

          <i class="ri-close-line nav__close" id="nav-close"></i>
        </div>

        <div class="nav__toggle" id="nav-toggle">
          <i class="ri-function-line"></i>
        </div>
      </nav>
    </header>

    <!-- Login Form -->
    <section class="login">
      <div class="login__container">
        <h2 class="login__title">Welcome Back</h2>
        <div class="login__error" id="errorMessage">
          Invalid email or password. Please try again.
        </div>
        <form id="loginForm">
          <input
            type="email"
            id="email"
            class="login__input"
            placeholder="Email"
            required
          />
          <input
            type="password"
            id="password"
            class="login__input"
            placeholder="Password"
            required
          />
          <button type="submit" class="button login__button">Login</button>
        </form>
        <div class="login__links">
          <!-- <p><a href="#">Forgot password?</a></p> -->
          <p>Don't have an account? <a href="sing_in.html">Sign up</a></p>
          <p><a href="home.html"> Back to Home</a></p>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      // Wait for DOM to be fully loaded
      document.addEventListener("DOMContentLoaded", function () {
        // Initialize form validation
        new FormValidator("loginForm");

        // Admin Login Credentials
        const ADMIN_EMAIL = "krish123@gmail.com";
        const ADMIN_PASSWORD = "123456";

        // Get form element
        const loginForm = document.getElementById("loginForm");

        if (loginForm) {
          // Login Form Handler
          loginForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");

            // Hide error message
            if (errorMessage) {
              errorMessage.classList.remove("show");
            }

            // Validate credentials
            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
              // Store login status in sessionStorage
              sessionStorage.setItem("adminLoggedIn", "true");
              sessionStorage.setItem("adminEmail", email);

              // Redirect to admin dashboard
              window.location.href = "../admin/dashboard.html";
            } else {
              // Show error message
              if (errorMessage) {
                errorMessage.classList.add("show");
              }

              // Clear password field
              const passwordField = document.getElementById("password");
              if (passwordField) {
                passwordField.value = "";
              }

              // Focus on email field
              const emailField = document.getElementById("email");
              if (emailField) {
                emailField.focus();
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
