pmake e <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Travel</title>

    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .login {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("assets/img/home1.jpg");
        background-size: cover;
        background-position: center;
        padding: 2rem;
      }

      .login__container {
        background-color: rgba(255, 255, 255, 0.95);
        padding: 2rem 2.5rem;
        border-radius: 1rem;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      body.dark-theme .login__container {
        background-color: rgba(34, 34, 34, 0.95);
        color: #fff;
      }

      .login__title {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      .login__input {
        width: 100%;
        padding: 0.75rem;
        margin: 0.5rem 0;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
      }

      .login__button {
        margin-top: 1rem;
        width: 100%;
      }

      .login__links {
        margin-top: 1rem;
        font-size: 0.9rem;
      }

      .nav__dark {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Dark/Light Toggle Button -->
    <div class="nav__dark">
      <span class="change-theme-name">Dark mode</span>
      <i class="ri-moon-line change-theme" id="theme-button"></i>
    </div>

    <!-- Login Form -->
    <section class="login">
      <div class="login__container">
        <h2 class="login__title">Welcome</h2>
        <form id="signInForm">
          <div class="form-group">
            <input
              type="text"
              id="name"
              name="name"
              class="login__input"
              placeholder="Name"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="email"
              id="email"
              name="email"
              class="login__input"
              placeholder="Email"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="date"
              id="birthDate"
              name="birthDate"
              class="login__input"
              placeholder="Birth Date"
              required
            />
          </div>
          <div class="form-group">
            <select id="gender" name="gender" class="login__input" required>
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <input
              type="tel"
              id="phone"
              name="phone"
              class="login__input"
              placeholder="Phone"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="text"
              id="address"
              name="address"
              class="login__input"
              placeholder="Address"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="password"
              name="password"
              class="login__input"
              placeholder="Password"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="login__input"
              placeholder="Confirm Password"
              required
            />
          </div>
          <button type="submit" class="button login__button">Sign In</button>
        </form>
        <div class="login__links">
          <!-- <p><a href="#">Forgot password?</a></p> -->
          <!-- <p>Don't have an account? <a href="#">Sign up</a></p> -->
          <p><a href="home.html"> Back to Home</a></p>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      // Initialize form validation
      document.addEventListener("DOMContentLoaded", function () {
        new FormValidator("signInForm");

        // Custom validation for password confirmation
        const passwordField = document.getElementById("password");
        const confirmPasswordField = document.getElementById("confirmPassword");

        if (confirmPasswordField) {
          confirmPasswordField.addEventListener("input", function () {
            validatePasswordConfirmation(passwordField, confirmPasswordField);
          });
        }
      });
    </script>
  </body>
</html>
